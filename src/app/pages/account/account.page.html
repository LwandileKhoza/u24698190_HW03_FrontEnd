<ion-header>
  <ion-toolbar>
    <ion-title>Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
 
  <div class="profile-header" *ngIf="userEmail">
    <div class="avatar">
      <span>{{ userEmail.charAt(0).toUpperCase() }}</span>
    </div>
    <h2 class="email">{{ userEmail }}</h2>
  </div>

  <ion-list class="stats-list">
 
    <ion-item>
      <ion-icon name="bookmark" slot="start" color="warning"></ion-icon>
      <ion-label>
        <h2>Watchlist</h2>
        <p>{{ watchlistCount }} movies saved</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="checkmark-circle" slot="start" color="success"></ion-icon>
      <ion-label>
        <h2>Watched</h2>
        <p>{{ watchedCount }} movies watched</p>
      </ion-label>
    </ion-item>

  </ion-list>

  <ion-button
    expand="full"
    color="danger"
    (click)="logout()">
    <ion-icon name="log-out" slot="start"></ion-icon>
    Log Out
  </ion-button>

</ion-content>
