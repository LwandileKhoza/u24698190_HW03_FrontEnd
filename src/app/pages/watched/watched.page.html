<ion-header>
  <ion-toolbar>
    <ion-title>Watched</ion-title>
  </ion-toolbar>
</ion-header>
 
<ion-content class="ion-padding">
 
  <div style="text-align:center; padding: 40px 0;" *ngIf="isLoading">
    <ion-spinner name="crescent" color="danger"></ion-spinner>
  </div>
 
  <p class="list-count" *ngIf="!isLoading && watched.length > 0">{{ watched.length }} movies watched</p>
 
  <div class="empty-state" *ngIf="!isLoading && watched.length === 0">
    <ion-icon name="checkmark-circle-outline" class="empty-icon"></ion-icon>
    <p>No movies watched yet.</p>
    <ion-button expand="block" routerLink="/tabs/search">Find Movies</ion-button>
  </div>
 
  <ion-grid *ngIf="!isLoading && watched.length > 0">
    <ion-row>
      <ion-col size="6" *ngFor="let movie of watched">
 
        <div class="movie-card">
 
          <div class="poster-wrapper">
            <img
              [src]="(movie.poster && movie.poster !== 'N/A') ? movie.poster : 'assets/no-poster.png'"
              alt="{{ movie.title }}"
              class="poster-img">
 
            <div class="times-badge">
              <span>{{ movie.timesWatched }}x</span>
            </div>
          </div>
 
          <div class="movie-info">
            <p class="movie-title">{{ movie.title }}</p>
            <p class="movie-year">{{ movie.year }}</p>
          </div>
 
          <ion-button
            expand="block"
            size="small"
            fill="outline"
            (click)="resetTimesWatched(movie.itemId)">
            <ion-icon name="refresh" slot="start"></ion-icon>
            Reset
          </ion-button>
 
          <ion-button
            expand="block"
            size="small"
            color="danger"
            fill="outline"
            (click)="removeFromWatched(movie.itemId)">
            Remove
          </ion-button>
 
        </div>
 
      </ion-col>
    </ion-row>
  </ion-grid>
 
</ion-content>
